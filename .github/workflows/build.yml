name: Build Windows app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test quota parsing
        shell: pwsh
        run: .\tests\run.ps1
      - name: Build portable package
        shell: pwsh
        run: .\build.ps1 -Package
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: TokenBaby-windows-portable
          path: dist/TokenBaby-portable.zip
          if-no-files-found: error
